[project]
name = "selena-insights"
version = "0.1.0"
description = "Personal transaction anomaly detection: autoencoder + baselines, evaluated with PR-AUC, served on ONNX"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pyarrow>=17",
  "scikit-learn>=1.5,<2",
  "scipy>=1.13,<2",
  "torch>=2.4,<3",
  "onnx>=1.16,<2",
  "onnxruntime>=1.19,<2",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27", "ruff>=0.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
